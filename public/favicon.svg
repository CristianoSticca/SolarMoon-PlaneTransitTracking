<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Night sky background -->
  <rect width="32" height="32" rx="6" fill="#0a0e1a"/>

  <!-- Full moon -->
  <circle cx="18" cy="14" r="9" fill="#f5e642" opacity="0.95"/>
  <!-- Moon subtle shading for depth -->
  <circle cx="18" cy="14" r="9" fill="url(#moonGradient)"/>

  <!-- Airplane silhouette (flying left-to-right across the moon) -->
  <!-- Body -->
  <path d="M6 17 L22 13 L24 14 L22 15 L8 18 Z" fill="#0a0e1a"/>
  <!-- Left wing -->
  <path d="M12 17 L9 22 L14 20 Z" fill="#0a0e1a"/>
  <!-- Right wing (small, rear) -->
  <path d="M18 15 L17 18 L20 16 Z" fill="#0a0e1a"/>
  <!-- Tail fin -->
  <path d="M7 17 L6 14 L9 16 Z" fill="#0a0e1a"/>

  <defs>
    <radialGradient id="moonGradient" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0.15"/>
    </radialGradient>
  </defs>
</svg>
